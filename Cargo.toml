[package]
name = "actix-web-tutorial"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.12.0"
serde = { version = "1.0", features = ["derive"] }
actix-files = "0.6.8"

actix-session = { version = "0.8", features = ["cookie-session"] }
actix-web-httpauth = "0.8"
reqwest = { version = "0.12", features = ["json"] }
dotenv = "0.15.0"
futures-util = "0.3.31"

actix-cors = "0.7"
env_logger = "0.11"
log = "0.4"
