<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>

<body>
    <div class="app">
        <header class="header">
            <h1>Connect</h1>
            <p class="subtitle">A simple social network</p>
            <div id="auth-section" class="auth-section">
                <button id="login-btn" class="btn-login" onclick="window.location.href='/auth/github/login'">Login with GitHub</button>
                <div id="user-info" class="user-info" style="display: none;">
                    <img id="user-avatar" src="" alt="Avatar" class="user-avatar-small">
                    <span id="user-name"></span>
                    <button id="logout-btn" class="btn-logout" onclick="logout()">Logout</button>
                </div>
            </div>
        </header>

        <main class="main">
            <section class="register-section">
                <h2>Create Account</h2>
                <form id="register-form" onsubmit="registerUser(event)">
                    <div class="form-group">
                        <input type="text" id="register-name" name="name" placeholder="Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="register-email" name="email" placeholder="Email" required>
                    </div>
                    <button type="submit" class="btn-primary">Sign Up</button>
                </form>
                <div id="register-result"></div>
            </section>

            <section class="users-section">
                <h2>Members</h2>
                <div id="users-list" hx-get="/api/users" hx-trigger="load" hx-swap="innerHTML">
                    <p class="loading">Loading users...</p>
                </div>
            </section>
        </main>
    </div>

    <script>
        function registerUser(event) {
            event.preventDefault();
            const name = document.getElementById('register-name').value;
            const email = document.getElementById('register-email').value;

            fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email })
            })
                .then(res => res.json())
                .then(data => {
                    document.getElementById('register-result').innerHTML =
                        '<div class="alert alert-success">Welcome, ' + data.name + '! Your account has been created.</div>';
                    document.getElementById('register-form').reset();
                    loadUsers();
                })
                .catch(err => {
                    document.getElementById('register-result').innerHTML =
                        '<div class="alert alert-error">Error creating account. Please try again.</div>';
                });
        }

        function loadUsers() {
            fetch('/api/users')
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('users-list');
                    if (data.data && data.data.length > 0) {
                        list.innerHTML = '<div class="users-grid">' +
                            data.data.map(user => {
                                const escapedName = user.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                                const escapedEmail = user.email.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                                const actionsHtml = isAuthenticated 
                                    ? `<button class="btn-edit" onclick="editUser(${user.id}, '${escapedName}', '${escapedEmail}')">Edit</button>
                                       <button class="btn-delete" onclick="deleteUser(${user.id})">Delete</button>`
                                    : '<p class="auth-required">Login to edit/delete</p>';
                                return `
                                <div class="user-card" id="user-${user.id}">
                                    <div class="user-avatar">${user.name.charAt(0).toUpperCase()}</div>
                                    <div class="user-info">
                                        <h3 id="user-name-${user.id}">${user.name}</h3>
                                        <p id="user-email-${user.id}">${user.email}</p>
                                        <span class="user-date">Joined ${new Date(user.created_at).toLocaleDateString()}</span>
                                    </div>
                                    <div class="user-actions" id="user-actions-${user.id}">
                                        ${actionsHtml}
                                    </div>
                                </div>
                            `;
                            }).join('') + '</div>';
                    } else {
                        list.innerHTML = '<p class="empty">No users yet. Be the first to sign up!</p>';
                    }
                })
                .catch(err => {
                    document.getElementById('users-list').innerHTML = '<p class="error">Error loading users</p>';
                });
        }

        function editUser(id, currentName, currentEmail) {
            if (!isAuthenticated) {
                alert('Please login to edit users');
                return;
            }

            const newName = prompt('Enter new name:', currentName);
            if (newName === null) return;

            const newEmail = prompt('Enter new email:', currentEmail);
            if (newEmail === null) return;

            fetch(`/api/users/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: newName, email: newEmail })
            })
                .then(res => {
                    if (res.ok) {
                        return res.json();
                    } else if (res.status === 401) {
                        alert('Authentication required. Please login again.');
                        checkAuth();
                        throw new Error('Unauthorized');
                    } else {
                        throw new Error('Update failed');
                    }
                })
                .then(data => {
                    loadUsers();
                })
                .catch(err => {
                    if (err.message !== 'Unauthorized') {
                        alert('Error updating user');
                    }
                });
        }

        function deleteUser(id) {
            if (!isAuthenticated) {
                alert('Please login to delete users');
                return;
            }

            if (!confirm('Are you sure you want to delete this user?')) {
                return;
            }

            fetch(`/api/users/${id}`, {
                method: 'DELETE'
            })
                .then(res => {
                    if (res.ok) {
                        return res.json();
                    } else if (res.status === 401) {
                        alert('Authentication required. Please login again.');
                        checkAuth();
                        throw new Error('Unauthorized');
                    } else {
                        throw new Error('Delete failed');
                    }
                })
                .then(data => {
                    loadUsers();
                })
                .catch(err => {
                    if (err.message !== 'Unauthorized') {
                        alert('Error deleting user');
                    }
                });
        }

        let isAuthenticated = false;
        let currentUser = null;

        function checkAuth() {
            fetch('/api/me')
                .then(res => {
                    if (res.ok) {
                        return res.json();
                    }
                    return null;
                })
                .then(user => {
                    if (user) {
                        isAuthenticated = true;
                        currentUser = user;
                        document.getElementById('login-btn').style.display = 'none';
                        document.getElementById('user-info').style.display = 'flex';
                        document.getElementById('user-avatar').src = user.avatar_url;
                        document.getElementById('user-name').textContent = user.login || user.name || 'User';
                    } else {
                        isAuthenticated = false;
                        currentUser = null;
                        document.getElementById('login-btn').style.display = 'block';
                        document.getElementById('user-info').style.display = 'none';
                    }
                    loadUsers();
                })
                .catch(err => {
                    console.error('Auth check failed:', err);
                    loadUsers();
                });
        }

        function logout() {
            window.location.href = '/auth/logout';
        }

        // Load users on page load
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
        });
    </script>
</body>

</html>
